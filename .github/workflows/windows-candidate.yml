name: Windows release candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Vidora.sln --locked-mode
      - name: Release build
        run: dotnet build Vidora.sln -c Release --no-restore
      - name: Full MSTest suite
        run: dotnet test Vidora.sln -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Packaging self-checks
        shell: pwsh
        run: ./scripts/test-packaging.ps1
      - name: Publish slim candidate
        shell: pwsh
        run: ./scripts/build-portable-zip.ps1 -OutputDirectory artifacts/ci-candidate
      - name: Archive smoke check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/package-content.ps1
          $zips = @(Get-ChildItem artifacts/ci-candidate/*.zip)
          if ($zips.Count -ne 1) { throw 'Expected exactly one archive' }
          $zip = $zips[0]
          $expected = (Get-Content "$($zip.FullName).sha256").Split(' ')[0]
          if ((Get-FileHash $zip.FullName).Hash.ToLowerInvariant() -ne $expected) { throw 'Checksum mismatch' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath artifacts/smoke
          Assert-SlimPackageContent (Resolve-Path artifacts/smoke).Path
          if (-not (Test-Path artifacts/smoke/coreclr.dll)) { throw 'Self-contained runtime missing' }
          $manifest = Assert-SlimPackageManifest (Resolve-Path artifacts/smoke).Path
          if ($manifest.sourceCommit -ne '${{ github.sha }}') { throw 'Source commit mismatch' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vidora-slim-candidate-${{ github.sha }}
          path: |
            artifacts/ci-candidate/*.zip
            artifacts/ci-candidate/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Windows-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
